# testsuite configuration -- what to test, against whom, for how long.
#
# All paths are relative to the repository root.  Edit this file rather than
# passing flags for anything you want to keep.

[paths]
results = "testsuite/results"
suites  = "testsuite/suites"

[defaults]
# Used by match / gauntlet / elo unless --tc says otherwise.  Short controls
# give many games per hour; long controls give a rating closer to the one the
# bot plays at on lichess.  "10+0.1" is 10 seconds plus 100 ms per move.
time_control = "30+2"
# How many games to run at the same time.  Keep concurrency * Threads at or
# below the number of physical cores, or the engines slow each other down and
# the rating comes out too low.
concurrency = 4
# Grace, in milliseconds, before a slow move counts as losing on time.  This
# covers pipe and scheduler latency, which a real tournament manager also
# allows for.
move_overhead_ms = 120

# --------------------------------------------------------------- the engine
# The engine under test.  Any UCI engine works; this is the one from engine/.
[engine]
name    = "ce"
command = "engine/ce.exe"
# ce.exe spells these commands `perft N` and `bench N`.  Most other engines
# want "go perft"; Stockfish needs "bench 16 1" so that the depth lands in the
# right argument slot.
perft_command = "perft"
bench_command = "bench"
options = { Hash = 1024, Threads = 6, EvalMode = "blend" }

# ---------------------------------------------------------------- the referee
# A strong engine used only by tools/make_suites.py to generate and verify the
# EPD files.  It never plays rated games.
[referee]
name    = "referee"
command = "stockfish/stockfish-windows-x86-64-universal.exe"
perft_command = "go perft"
bench_command = "bench 16 1"
options = { Threads = 4, Hash = 1024 }

# -------------------------------------------------------------- the opponents
# A ladder of Stockfish strengths.  `elo` is the rating the Elo fit assumes
# for that opponent; with UCI_LimitStrength these are Stockfish's own UCI_Elo
# numbers, so the resulting rating is on Stockfish's scale.  Override `elo` if
# you want to anchor the ladder to a rating list you trust more.
#
# Move Overhead is raised a little because these engines are driven over a
# pipe by Python, not by a C++ tournament manager.

[[opponent]]
name = "sf-1320"
command = "stockfish/stockfish-windows-x86-64-universal.exe"
elo = 1320
options = { Threads = 1, Hash = 32, "Move Overhead" = 50, UCI_LimitStrength = true, UCI_Elo = 1320 }

