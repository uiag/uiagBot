# Full strength, one thread.  No `elo` on purpose: nobody knows what a single
# Stockfish 18 thread at 10+0.1 is worth on the UCI_Elo scale, and a guess
# would poison the fit.  Add `elo = ...` yourself if you want it counted.
[[opponent]]
name = "sf-full"
command = "stockfish/stockfish-windows-x86-64-universal.exe"
options = { Threads = 1, Hash = 128, "Move Overhead" = 50 }
note = "unrated: full strength, excluded from the Elo fit"

# ----------------------------------------------------------- when to stop a game
[adjudication]
max_plies      = 400   # a game longer than this is called a draw
draw_enabled   = true
draw_plies     = 10    # this many consecutive plies inside draw_score
draw_score     = 8     # centipawns
draw_after_ply = 100    # never adjudicate a draw before this ply
resign_enabled = true
resign_plies   = 6     # this many consecutive moves below resign_score
# In the engine's own units, which are not centipawns: a pawn measures about
# 77 here (the start position reads 47, and 124 with a black pawn taken off).
# The old value of 900 was therefore eleven pawns, so the resign rule never
# fired at all and every lost game was played out to mate -- which is most of
# why a 4000-game match takes forty minutes rather than twenty-five.  400 is
# a little over five pawns and is not coming back at this strength.
#
# Every result recorded in engine/README.md was measured at 900.  Changing
# this does not invalidate them -- both sides of a duel are always judged by
# the same rule -- but a match run now is not bit-identical to one run then.
resign_score   = 400

# ---------------------------------------------------------- our own builds
# Frozen copies of the engine, used to test a source change against the build
# it replaces.  `ce-base` is the v1.0 build this work started from and never
# moves; `ce-prev` is whatever the last accepted step produced.
#
#   python testsuite/run.py sprt ce --engine ce-prev --elo1 5
#
[[opponent]]
name    = "ce-prev"
command = "engine/ce_prev.exe"
perft_command = "perft"
bench_command = "bench"
options = { Hash = 64, Threads = 1, EvalMode = "hce" }
note    = "unrated: the previous accepted build"

[[opponent]]
name    = "ce-base"
command = "engine/ce_base.exe"
perft_command = "perft"
bench_command = "bench"
options = { Hash = 64, Threads = 1, EvalMode = "hce" }
note    = "unrated: the v1.0 build, frozen"

[[opponent]]
name    = "ce-new"
command = "engine/ce_new.exe"
perft_command = "perft"
bench_command = "bench"
options = { Hash = 64, Threads = 1, EvalMode = "hce" }
note    = "unrated: the candidate build"

# The same binary with the previous network.  `ce` loads net3.bin (king
# buckets), this loads net2.bin, and nothing else differs -- same search, same
# options -- so a duel between them measures the network and only the network,
# speed included.  That last part matters: at a fixed node count a slower net
# is not charged for being slower, which is how a 1536-wide version of this
# came to look like +33.8 Elo and play like -2.7.
[[opponent]]
name    = "ce-net2"
command = "engine/ce.exe --net net2.bin"
perft_command = "perft"
bench_command = "bench"
options = { Hash = 64, Threads = 1, EvalMode = "blend" }
note    = "unrated: the single-bucket network net3 replaced"

# A snapshot of the build under test, so that editing and rebuilding the engine
# cannot disturb a match that is already running.
[[opponent]]
name    = "ce-cand"
command = "engine/ce_cand.exe"
perft_command = "perft"
bench_command = "bench"
options = { Hash = 64, Threads = 1, EvalMode = "hce" }
note    = "unrated: frozen snapshot of the candidate"
